
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Janinolino | Game Wishlist</title>

<style>
@font-face {
  * {
  font-family: 'BubblesIn90s', Arial, sans-serif !important;
}
  font-family: 'BubblesIn90s';
  src: url('./BubblesIn90s.otf') format('opentype');
  font-weight: normal;
  font-style: normal;
}
  * { box-sizing: border-box; }

body {
  margin: 0;
  font-family: 'BubblesIn90s', Arial, sans-serif;
  color: #493c59;
  background:
    radial-gradient(ellipse at 10% 10%, #ffd6ec, transparent 50%),
    radial-gradient(ellipse at 90% 20%, #c9f0ff, transparent 50%),
    radial-gradient(ellipse at 50% 100%, #e8d5ff, transparent 55%),
    #fffaff;
  min-height: 100vh;
}

header {
  text-align: center;
  padding: 65px 20px 35px;
}

.logo {
  font-size: 15px;
  letter-spacing: 5px;
  font-weight: bold;
  background: linear-gradient(90deg,#ee8cbd,#9b83e9,#72cce1);
  color: transparent;
  background-clip: text;
}

h1 {
  font-size: clamp(38px, 7vw, 65px);
  margin: 18px 0 10px;
  background: linear-gradient(100deg,#f18bb9,#a18ae9,#65cbdc);
  color: transparent;
  background-clip: text;
}

.subtitle { color: #8c789e; }

main {
  max-width: 1050px;
  margin: auto;
  padding: 20px;
}

.search {
  width: 100%;
  padding: 17px 20px;
  border: 1px solid #ead8f4;
  border-radius: 18px;
  background: #ffffffbd;
  font-size: 16px;
  outline: none;
  box-shadow: 0 8px 25px #c9a8dc20;
}

.filters {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 10px;
  margin: 22px 0 30px;
}

.filter {
  border: 1px solid #ead6f3;
  background: #ffffffa8;
  color: #826b96;
  border-radius: 30px;
  padding: 11px 18px;
  cursor: pointer;
}

.filter.active {
  background: linear-gradient(100deg,#f3b4d5,#c4b2f5,#a9e1eb);
  color: #554365;
  border: none;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit,minmax(220px,1fr));
  gap: 20px;
}

.game {
  background: #ffffffb9;
  border: 1px solid #ffffff;
  border-radius: 22px;
  padding: 20px;
  box-shadow: 0 10px 30px #b99bc51b;
  transition: .2s;
}

.game:hover {
  transform: translateY(-5px);
  box-shadow: 0 14px 30px #b99bc535;
}

.cover {
  height: 125px;
  border-radius: 15px;
  display: grid;
  place-items: center;
  font-size: 42px;
  background: linear-gradient(135deg,#f6c8df,#d6c6fa,#b9e8f0);
}

.game h3 { margin-bottom: 8px; }

.tag {
  display: inline-block;
  background: #f0e5fa;
  color: #866ba5;
  border-radius: 20px;
  padding: 6px 10px;
  font-size: 12px;
  margin: 3px;
}

.status {
  color: #9b80b2;
  font-size: 13px;
  margin-top: 13px;
}

.empty {
  text-align: center;
  padding: 40px;
  color: #917da3;
}

footer {
  text-align: center;
  padding: 45px 15px;
  color: #a18eae;
  font-size: 13px;
}
</style>
</head>

<body>

<header>
    <div class="logo">Games von</div>
 <h1>✦ JANINOLINO ✦</h1>
  <p class="subtitle">
    Welche Game erwartet uns als Nächstes? ♡
  </p>
</header>

<main>
  <input
    class="search"
    id="search"
    placeholder="🔎  Suche nach einem Spiel..."
  >

  <div class="filters" id="filters">
    <button class="filter active" data-category="Alle">Alle</button>
    <button class="filter" data-category="Horror">Horror</button>
    <button class="filter" data-category="Cozy">Cozy</button>
    <button class="filter" data-category="Simulator">Simulator</button>
    <button class="filter" data-category="Multiplayer">Multiplayer</button>
    <button class="filter" data-category="Party">Party</button>
  </div>

  <div class="grid" id="games"></div>
</main>

<footer>
  ✨ Made with love for Janinolino ✨
  <br><br>
  Twitch.tv/janinolino
</footer>

<script>
const gameList = [
  {
    name: "Phasmophobia",
    category: ["Horror", "Multiplayer"],
    emoji: "👻",
    status: "Auf der Wunschliste"
  },
  {
    name: "Lethal Company",
    category: ["Horror", "Multiplayer"],
    emoji: "🚀",
    status: "Auf der Wunschliste"
  },
  {
    name: "The Sims 4",
    category: ["Cozy", "Simulator"],
    emoji: "🏡",
    status: "Auf der Wunschliste"
  },
  {
    name: "Stardew Valley",
    category: ["Cozy", "Multiplayer"],
    emoji: "🌸",
    status: "Auf der Wunschliste"
  },
  {
    name: "House Flipper",
    category: ["Simulator", "Cozy"],
    emoji: "🏠",
    status: "Auf der Wunschliste"
  },
  {
    name: "Party Animals",
    category: ["Party", "Multiplayer"],
    emoji: "🐻",
    status: "Auf der Wunschliste"
  }
];

let selected = "Alle";

function renderGames() {
  const search = document.getElementById("search").value.toLowerCase();

  const filtered = gameList.filter(game =>
    game.name.toLowerCase().includes(search) &&
    (selected === "Alle" || game.category.includes(selected))
  );

  const container = document.getElementById("games");

  if (!filtered.length) {
    container.innerHTML = '<div class="empty">Keine Spiele gefunden 💜</div>';
    return;
  }

  container.innerHTML = filtered.map(game => `
    <article class="game">
      <div class="cover">${game.emoji}</div>
      <h3>${game.name}</h3>
      <div>
        ${game.category.map(cat =>
          `<span class="tag">${cat}</span>`
        ).join("")}
      </div>
      <div class="status">♡ ${game.status}</div>
    </article>
  `).join("");
}

document.getElementById("search").addEventListener("input", renderGames);

document.querySelectorAll(".filter").forEach(button => {
  button.addEventListener("click", () => {
    document.querySelectorAll(".filter").forEach(b =>
      b.classList.remove("active")
    );
    button.classList.add("active");
    selected = button.dataset.category;
    renderGames();
  });
});

renderGames();
</script>

</body>
</html>
