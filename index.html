
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Janinolino | Spieleliste</title>

<style>
@font-face {
  font-family: 'BubblesIn90s';
  src: url('./BubblesIn90s.otf') format('opentype');
  font-weight: normal;
  font-style: normal;
}

* {
  box-sizing: border-box;
  font-family: 'BubblesIn90s', Arial, sans-serif;
}
}
  * { box-sizing: border-box; }

body {
  margin: 0;
  font-family: 'BubblesIn90s', Arial, sans-serif;
  color: #493c59;
  background:
    radial-gradient(ellipse at 10% 10%, #ffd6ec, transparent 50%),
    radial-gradient(ellipse at 90% 20%, #c9f0ff, transparent 50%),
    radial-gradient(ellipse at 50% 100%, #e8d5ff, transparent 55%),
    #fffaff;
  min-height: 100vh;
}

header {
  text-align: center;
  padding: 65px 20px 35px;
}

.logo {
  font-size: 15px;
  letter-spacing: 5px;
  font-weight: bold;
  background: linear-gradient(90deg,#ee8cbd,#9b83e9,#72cce1);
  color: transparent;
  background-clip: text;
}

h1 {
  font-size: clamp(38px, 7vw, 65px);
  margin: 18px 0 10px;
  background: linear-gradient(100deg,#f18bb9,#a18ae9,#65cbdc);
  color: transparent;
  background-clip: text;
}

.subtitle { color: #8c789e; }

main {
  max-width: 1050px;
  margin: auto;
  padding: 20px;
}

.search {
  width: 100%;
  padding: 17px 20px;
  border: 1px solid #ead8f4;
  border-radius: 18px;
  background: #ffffffbd;
  font-size: 16px;
  outline: none;
  box-shadow: 0 8px 25px #c9a8dc20;
}

.filters {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 10px;
  margin: 22px 0 30px;
}
.status-filter {
  text-align: center;
  margin: -15px 0 25px;
}

.status-filter select {
  font-family: 'BubblesIn90s', Arial, sans-serif;
  background: #f1e7fa;
  color: #8b6da8;
  border: 1px solid #e2d1f0;
  border-radius: 20px;
  padding: 9px 16px;
  font-size: 14px;
  cursor: pointer;
}
.filter {
  border: 1px solid #ead6f3;
  background: #ffffffa8;
  color: #826b96;
  border-radius: 30px;
  padding: 11px 18px;
  cursor: pointer;
}

.filter.active {
  background: linear-gradient(100deg,#f3b4d5,#c4b2f5,#a9e1eb);
  color: #554365;
  border: none;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit,minmax(220px,1fr));
  gap: 20px;
}

.game {
  display: flex;
  flex-direction: column;
  height: 100%;
  box-sizing: border-box;
  background: rgba(255, 255, 255, 0.58);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.85);
  border-radius: 24px;
  padding: 20px;
  box-shadow: 0 8px 30px rgba(185, 155, 210, 0.13);
  transition: all 0.25s ease;
}

.game:hover {
  transform: translateY(-6px);
  box-shadow: 0 16px 38px rgba(190, 150, 225, 0.25);
  border-color: #e8d5ff;
  background: rgba(255, 255, 255, 0.78);
}

.cover {
  height: 125px;
  border-radius: 15px;
  overflow: hidden;
  background: linear-gradient(135deg,#f6c8df,#d6c6fa,#b9e8f0);
}

.cover img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.3s ease;
}
.game:hover .cover img {
  transform: scale(1.08);
}
.game h3 {
  margin-bottom: 8px;
  color: #655477;
  font-weight: normal;
  font-size: 19px;
}

.tag {
  display: inline-block;
  background: #f0e5fa;
  color: #866ba5;
  border-radius: 20px;
  padding: 6px 10px;
  font-size: 12px;
  margin: 3px;
}

.status {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-sizing: border-box;
  min-height: 30px;
  min-width: 145px;
  color: #8b6da8;
  background: #f1e7fa;
  border: 1px solid #e2d1f0;
  border-radius: 20px;
  padding: 5px 12px;
  font-size: 13px;
  margin-top: 13px;
  white-space: nowrap;
}
.game .status {
  margin-top: auto;
  align-self: flex-start;
}
.empty {
  text-align: center;
  padding: 40px;
  color: #917da3;
}

footer {
  text-align: center;
  padding: 45px 15px;
  color: #a18eae;
  font-size: 13px;
}
</style>
</head>

<body>

<header>
    <div class="logo">Games von</div>
 <h1>✦ JANINOLINO ✦</h1>
  <p class="subtitle">
    Welche Game erwartet uns als Nächstes? ♡
  </p>
</header>

<main>
  <input
    class="search"
    id="search"
    placeholder="🔎  Suche nach einem Spiel..."
  >

  <div class="filters" id="filters">
    <button class="filter active" data-category="Alle">Alle</button>
    <button class="filter" data-category="Horror">Horror</button>
    <button class="filter" data-category="Cozy">Cozy</button>
    <button class="filter" data-category="Simulator">Simulator</button>
    <button class="filter" data-category="Multiplayer">Multiplayer</button>
    <button class="filter" data-category="Party">Party</button>
  </div>
<div class="status-filter">
  <select id="statusFilter">
    <option value="Alle">Alle Status</option>
    <option value="Auf Wishlist">Auf der Wunschliste</option>
    <option value="Durchgespielt">Durchgespielt</option>
  </select>
</div>
  <div class="grid" id="games"></div>
</main>

<footer>
  ✨ Made with love from DIDDY ✨
  <br><br>
  ✨ Twitch.tv/janinolino ✨
</footer>

<script>

let gameList = [];


let selected = "Alle";
  async function loadSteamCovers() {
  await Promise.all(gameList.map(async game => {
    try {
      const url = "https://proxy.cors.dev/https://store.steampowered.com/api/appdetails?appids=" + game.appid + "&filters=basic";

      const response = await fetch(url, { credentials: "omit" });
      const result = await response.json();

      if (result[game.appid]?.success) {
        game.image = result[game.appid].data.header_image;
      }
    } catch (error) {
      console.log("Bild konnte nicht geladen werden:", game.name);
    }
  }));

  renderGames();
}

function renderGames() {
  const search = document.getElementById("search").value.toLowerCase();
  const statusSelected = document.getElementById("statusFilter").value;

  const filtered = gameList.filter(game =>
    game.name.toLowerCase().includes(search) &&
    (selected === "Alle" || game.category.includes(selected)) &&
    (statusSelected === "Alle" || game.status === statusSelected)
  );

  const container = document.getElementById("games");

  if (!filtered.length) {
    container.innerHTML = '<div class="empty">Keine Spiele gefunden 💜</div>';
    return;
  }

  container.innerHTML = filtered.map(game => `
    <article class="game">
      <div class="cover">
 <img src="${game.image || ""}" alt="${game.name}">
</div>
      <h3>${game.name}</h3>
      <div>
        ${game.category.map(cat =>
          `<span class="tag">${cat}</span>`
        ).join("")}
      </div>
      <div class="status">♡ ${game.status}</div>
    </article>
  `).join("");
}

document.getElementById("search").addEventListener("input", renderGames);
document.getElementById("statusFilter").addEventListener("change", renderGames);
document.querySelectorAll(".filter").forEach(button => {
  button.addEventListener("click", () => {
    document.querySelectorAll(".filter").forEach(b =>
      b.classList.remove("active")
    );
    button.classList.add("active");
    selected = button.dataset.category;
    renderGames();
  });
});

async function loadGamesFromDatabase() {
  try {
    const response = await fetch("/api/games");

    if (!response.ok) {
      throw new Error("Spiele konnten nicht geladen werden");
    }

    const games = await response.json();

    gameList = games.map(game => ({
      name: game.name,
      appid: game.appid,
      category: game.category.split(",").map(c => c.trim()),
      status: game.status
    }));

    renderGames();
    loadSteamCovers();

  } catch (error) {
    console.error("Fehler beim Laden:", error);
    document.getElementById("games").innerHTML =
      '<div class="empty">Spiele konnten nicht geladen werden 💜</div>';
  }
}

loadGamesFromDatabase();
</script>

</body>
</html>
