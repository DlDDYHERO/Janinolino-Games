
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Janinolino | Spieleverwaltung</title>
<style>
@font-face {
  font-family: Bubbles;
  src: url("BubblesIn90s.otf");
}
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 25px 15px;
  font-family: Bubbles, sans-serif;
  color: #806493;
  background: linear-gradient(135deg,#fce4f2,#e8e1ff,#dff3ff);
  min-height: 100vh;
}
main {
  max-width: 850px;
  margin: 30px auto;
}
.panel {
  background: rgba(255,255,255,.75);
  border: 1px solid white;
  border-radius: 24px;
  padding: 25px;
  margin-bottom: 20px;
  box-shadow: 0 8px 30px #b99bd222;
}
h1, h2 { text-align: center; }
input, select, button {
  width: 100%;
  padding: 12px;
  margin: 7px 0;
  border: 1px solid #e2d1f0;
  border-radius: 13px;
  font: inherit;
}
button {
  background: #eadcf8;
  color: #806493;
  cursor: pointer;
}
button:hover { background: #ddc8f1; }
.game {
  background: #fff9ff;
  border: 1px solid #eadcf8;
  border-radius: 16px;
  padding: 15px;
  margin: 12px 0;
}
.game strong { display: block; margin-bottom: 7px; }
.actions {
  display: flex;
  gap: 10px;
}
.actions button { flex: 1; }
#admin, #cancelEdit { display: none; }
#message { text-align: center; margin: 12px 0; }
.small { font-size: 13px; opacity: .8; }
</style>
</head>
<body>
<main>
  <section class="panel" id="login">
    <h1>✦ JANINOLINO ✦</h1>
    <h2>Admin-Bereich ♡</h2>
    <form id="loginForm">
      <input type="password" id="password"
        placeholder="Admin-Passwort" required>
      <button type="submit">Einloggen</button>
    </form>
  </section>

  <section id="admin">
    <div class="panel">
      <h1>✦ Spieleverwaltung ✦</h1>
      <button type="button" id="logoutButton">Abmelden ✕</button>
      <p>Hier kannst du die Games verwalten.</p>
      <h2 id="formTitle">Neues Spiel hinzufügen</h2>
      <form id="gameForm">
        <input id="name" placeholder="Spielname" required>
        <input id="appid" placeholder="Steam App-ID (optional)">
       <div id="categoryOptions">
  <p>Kategorien hinzufügen:</p>

  <input
    id="categoryInput"
    list="categorySuggestions"
    placeholder="Kategorie eingeben oder auswählen..."
    autocomplete="off"
  >

  <datalist id="categorySuggestions">
    <option value="Horror">
    <option value="Action">
    <option value="Adventure">
    <option value="Cozy">
    <option value="Simulation">
    <option value="Simulator">
    <option value="Multiplayer">
    <option value="Party">
    <option value="Survival">
    <option value="Roguelike">
    <option value="RPG">
    <option value="Strategy">
    <option value="Puzzle">
    <option value="Racing">
    <option value="Sports">
    <option value="Sandbox">
    <option value="Open World">
    <option value="Platformer">
    <option value="Indie">
    <option value="Casual">
  </datalist>

  <button type="button" id="addCategoryButton">
    Kategorie hinzufügen
  </button>

  <div id="selectedCategories"></div>
</div>
        <select id="status">
          <option>Im Besitz</option>
          <option>Durchgespielt</option>
          <option>Auf Wishlist</option>
        </select>
        <button type="submit" id="saveButton">Spiel hinzufügen</button>
        <button type="button" id="cancelEdit">Bearbeiten abbrechen</button>
      </form>
      <div id="message"></div>
    </div>

    <div class="panel">
      <h2>Alle Spiele</h2>
      <div id="gamesList">Spiele werden geladen...</div>
    </div>
  </section>
</main>

<script>
const loginSection = document.getElementById("login");
const adminSection = document.getElementById("admin");
const message = document.getElementById("message");
const gameForm = document.getElementById("gameForm");
const gamesList = document.getElementById("gamesList");
const gameForm = document.getElementById("gameForm");
const gamesList = document.getElementById("gamesList");

// HIER den neuen Kategorie-Code einfügen

async function loadGames() {
async function loadGames() {
  gamesList.textContent = "Spiele werden geladen...";
  try {
    const response = await fetch("/api/games");
    if (!response.ok) throw new Error();
    const games = await response.json();

    gamesList.replaceChildren();

    games.forEach(game => {
      const card = document.createElement("div");
      card.className = "game";

      const title = document.createElement("strong");
      title.textContent = game.name;

      const details = document.createElement("p");
      details.textContent =
        "Kategorie: " + game.category + " | Status: " + game.status;

      const appid = document.createElement("p");
      appid.className = "small";
      appid.textContent = game.appid
        ? "Steam App-ID: " + game.appid
        : "Keine Steam App-ID";

      const actions = document.createElement("div");
      actions.className = "actions";

      const edit = document.createElement("button");
      edit.textContent = "Bearbeiten";
      edit.type = "button";
      edit.addEventListener("click", () => editGame(game));

      const remove = document.createElement("button");
      remove.textContent = "Löschen";
      remove.type = "button";
      remove.addEventListener("click", () => deleteGame(game.id));

      actions.append(edit, remove);
      card.append(title, details, appid, actions);
      gamesList.append(card);
    });

    if (games.length === 0) {
      gamesList.textContent = "Noch keine Spiele vorhanden.";
    }
  } catch {
    gamesList.textContent = "Fehler beim Laden der Spiele.";
  }
}

function showAdmin() {
  loginSection.style.display = "none";
  adminSection.style.display = "block";
  loadGames();
}

async function checkLogin() {
  try {
    const response = await fetch("/api/check");
    if (response.ok) showAdmin();
  } catch {}
}

document.getElementById("loginForm").addEventListener("submit",
async event => {
  event.preventDefault();
  message.textContent = "Anmeldung läuft...";

  try {
    const response = await fetch("/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        password: document.getElementById("password").value
      })
    });

    if (!response.ok) {
      message.textContent = "Passwort ist leider falsch.";
      return;
    }

    message.textContent = "";
    showAdmin();
  } catch {
    message.textContent = "Verbindungsfehler.";
  }
});

function editGame(game) {
  document.getElementById("name").value = game.name;
  document.getElementById("appid").value = game.appid || "";
  selectedCategories = (game.category || "")
  .split(",")
  .map(c => c.trim())
  .filter(Boolean);

renderSelectedCategories();
  document.getElementById("status").value = game.status;

  gameForm.dataset.editId = game.id;
  document.getElementById("formTitle").textContent = "Spiel bearbeiten";
  document.getElementById("saveButton").textContent = "Änderungen speichern";
  document.getElementById("cancelEdit").style.display = "block";
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function resetForm() {
  gameForm.reset();
    selectedCategories = [];
  renderSelectedCategories();
  delete gameForm.dataset.editId;
  document.getElementById("formTitle").textContent =
    "Neues Spiel hinzufügen";
  document.getElementById("saveButton").textContent = "Spiel hinzufügen";
  document.getElementById("cancelEdit").style.display = "none";
}

document.getElementById("cancelEdit").addEventListener("click", resetForm);

gameForm.addEventListener("submit", async event => {
  event.preventDefault();

  const data = {
    name: document.getElementById("name").value,
    appid: document.getElementById("appid").value,
   category: selectedCategories.join(", "),
    status: document.getElementById("status").value
  };
if (!data.category) {
  alert("Bitte mindestens eine Kategorie auswählen!");
  return;
}
  const id = gameForm.dataset.editId;
  if (id) data.id = Number(id);

  message.textContent = "Wird gespeichert...";

  try {
    const response = await fetch("/api/games", {
      method: id ? "PUT" : "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(data)
    });

    if (!response.ok) throw new Error();

    message.textContent = "Spiel erfolgreich gespeichert! ♡";
    resetForm();
    await loadGames();
  } catch {
    message.textContent = "Speichern fehlgeschlagen. Bitte neu anmelden.";
  }
});

async function deleteGame(id) {
  if (!confirm("Möchtest du dieses Spiel wirklich löschen?")) return;

  try {
    const response = await fetch("/api/games", {
      method: "DELETE",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id })
    });

    if (!response.ok) throw new Error();

    message.textContent = "Spiel gelöscht.";
    await loadGames();
  } catch {
    message.textContent = "Löschen fehlgeschlagen. Bitte neu anmelden.";
  }
}
document.getElementById("logoutButton").addEventListener("click", async () => {
  await fetch("/api/logout", { method: "POST" });
  window.location.reload();
});
checkLogin();
</script>
</body>
</html>
